name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify generated files are in sync
        shell: bash
        run: |
          bash scripts/sync-agent-rules.sh
          node scripts/sync-skills.mjs

          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Generated files are out of sync with their sources (AGENTS.md / SKILL.md)."
            echo "Run the sync scripts locally and commit the result:"
            echo "  bash scripts/sync-agent-rules.sh"
            echo "  node scripts/sync-skills.mjs"
            git status --short
            git diff --stat
            exit 1
          fi
          echo "All generated files are in sync with their sources."

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Validate generated content
        run: npm run check:data

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production smoke test
        shell: bash
        run: |
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static

          PORT=3107 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/learningseo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3107/ > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/learningseo-server.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3107/ > /dev/null
          BASE_URL=http://127.0.0.1:3107 npm run test:smoke
